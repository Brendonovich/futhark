name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # GitHub's runners have no GPU, so the tests run on lavapipe, Mesa's software Vulkan driver.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      # The desktop app's Rune links libxkbcommon and libwayland-client at build time.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check
