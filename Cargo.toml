[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brendonovich/futhark"

[workspace.dependencies]
futhark-gpu = { path = "crates/gpu" }
futhark-graph = { path = "crates/graph" }
futhark-macros = { path = "crates/macros" }
futhark-ops = { path = "crates/ops" }
futhark-project = { path = "crates/project" }
futhark-surfaces = { path = "crates/surfaces" }

clap = { version = "=4.6.7", features = ["derive"] }
kdl = { version = "=6.7.1", default-features = false }
# The Mach calls that hand IOSurfaces between processes (macOS only).
mach2 = "=0.6.0"
# The objc2 bindings at the versions wgpu's Metal backend already builds, so the tree has one copy of each.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = [
    "std",
    "IOSurfaceRef",
    "IOSurfaceTypes",
    "libc",
    "objc2-core-foundation",
] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
pollster = "=1.0.1"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
# syn 2 rather than 3: clap's derive already builds syn 2, so the tree has one copy.
syn = { version = "=2.0.119", features = ["full"] }
thiserror = "=2.0.21"
# Matches Rune's wgpu exactly, so the engine's device can be shared with the UI. Default features are off for the
# same reason: no GL backend, and WGSL as the only shader language. Vulkan and DX12 are added per platform in
# crates/gpu.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
